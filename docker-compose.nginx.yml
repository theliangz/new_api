services:
  nginx:
    image: nginx:alpine
    container_name: new-api-nginx
    restart: always
    network_mode: host
    volumes:
      - ./deploy/nginx/tokengateway.instantech.cn.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/static:/var/www/token-gateway:ro
      - ./ssl:/root/projects/new_api/ssl:ro
